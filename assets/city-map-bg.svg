<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cityHeat" x1="0" y1="1100" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="0.32" stop-color="#fb923c"/>
      <stop offset="0.62" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="streetPat" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-14 10 10)">
      <path d="M20 0 H0 M0 0 V20" fill="none" stroke="url(#cityHeat)" stroke-width="1.05" stroke-linecap="square"/>
    </pattern>
    <mask id="islandMask">
      <rect width="900" height="1100" fill="white"/>
      <ellipse cx="498" cy="418" rx="88" ry="118" fill="black" transform="rotate(-14 498 418)"/>
    </mask>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- !8;CMB «>AB@>20»: :@C?=K9 =0:;>=Q==K9 ?>;83>= + 2K@57 «?0@:» -->
  <g mask="url(#islandMask)" filter="url(#lineGlow)">
    <path d="M-120 1040 L 820 -80 L 1020 220 L 80 1160 Z" fill="url(#streetPat)"/>
  </g>
</svg>
